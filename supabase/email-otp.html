<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif">
<div style="padding:32px 16px">
<div style="max-width:440px;margin:auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px;overflow:hidden">
<div style="padding:28px 32px;text-align:center;background:#171717">
<div style="color:#fff;font-size:22px;font-weight:800">Akouè</div>
<div style="color:#a3a3a3;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:4px">Maîtrise ton argent</div>
</div>
<div style="padding:28px 32px;text-align:center">
<h2 style="color:#18181b;margin:0 0 8px;font-size:20px">Ton code de confirmation</h2>
<p style="color:#52525b;font-size:14px;line-height:21px;margin:0">Entre ce code dans l'app pour activer ton compte.<br>Expire dans <b>3 minutes</b>.</p>
<div style="margin:22px auto 6px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:12px;padding:16px;max-width:280px">
<div style="font-size:34px;letter-spacing:8px;font-weight:800;color:#18181b;padding-left:8px">{{ .Token }}</div>
</div>
<div style="color:#71717a;font-size:12px;margin-top:8px">Ne partage ce code avec personne</div>
</div>
<div style="padding:16px 32px;text-align:center;background:#fafafa;border-top:1px solid #e4e4e7">
<div style="color:#71717a;font-size:11px">L’équipe Akouè</div>
</div>
</div>
</div>
</body>
</html>
