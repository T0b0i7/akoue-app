<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre code de confirmation Akouè</title>
</head>
<body style="margin:0;padding:0;background:#05070F;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff">
  <table role="presentation" cellspacing="0" cellpadding="0" width="100%" style="max-width:620px;margin:auto;padding:24px 15px">
    <tr><td align="center">
      <img src="https://rquwmzgxcgpqrlskhwfb.supabase.co/storage/v1/object/public/emails/mono-akoue.png" alt="Akouè" width="48" height="48" style="display:block;border-radius:14px">
    </td></tr>
    <tr><td align="center" style="padding:26px 0 14px">
      <h1 style="font-size:26px;margin:0 0 6px;font-weight:800;letter-spacing:-0.5px;color:#ffffff">Akouè</h1>
      <p style="font-size:13px;margin:0;color:#818cf8">Maîtrise ton argent</p>
    </td></tr>
    <tr><td align="center">
      <table role="presentation" cellspacing="0" cellpadding="0">
        <tr><td style="background:#0B1530;border-radius:22px;padding:30px;text-align:center;border:1px solid #1f2937">
          <p style="font-size:12px;letter-spacing:1.5px;color:#818cf8;text-transform:uppercase;margin:0 0 18px">Code de confirmation</p>
          <div style="font-size:38px;font-weight:900;letter-spacing:10px;color:#ffffff;background:#111827;border-radius:12px;padding:18px 36px;display:inline-block;box-shadow:0 10px 30px rgba(0,0,0,.5)">{{ .Token }}</div>
          <p style="font-size:13px;margin-top:22px;color:#9ca3af">Saisis ce code dans l'app Akouè pour activer ton compte.</p>
          <p style="font-size:12px;margin-top:6px;color:#6b7280">Le code expire dans 3 minutes.</p>
        </td></tr>
      </table>
    </td></tr>
    <tr><td align="center" style="padding:22px 0">
      <p style="font-size:11px;color:#4b5563;line-height:1.6;margin:0">
        Ne partagez ce code avec personne.<br>
        © Akouè — gestion de tes finances.
      </p>
    </td></tr>
  </table>

</html>
