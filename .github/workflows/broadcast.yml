# Auto-broadcast : à chaque push sur main, insère une notif dans Supabase
# pour que même les anciennes versions installées soient prévenues.
# Secrets GitHub requis : SUPABASE_URL, SUPABASE_SERVICE_KEY (service_role, pas anon).
name: broadcast-on-push

on:
  push:
    branches: [main]

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build message from commits
        id: msg
        run: |
          RAW=$(git log -1 --pretty=%B)
          # Titre court + vulgarisé : retire le préfixe technique "feat:/fix:/..."
          BODY=$(echo "$RAW" | head -n 1 | sed -E 's/^[a-z]+(\([^)]*\))?:\s*//i' | head -c 200)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "Appuie sur Mettre à jour."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "details<<EOF"
            echo "$RAW" | head -c 800
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          VERSION=$(jq -r '.expo.version' app.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Tag [no-broadcast] dans le message de commit pour sauter la notif
          if echo "$RAW" | grep -qi "\[no-broadcast\]"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Insert broadcast into Supabase
        if: steps.msg.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          TITLE="Nouvelle mise à jour Akouè"
          jq -n \
            --arg t "$TITLE" \
            --arg b "${{ steps.msg.outputs.body }}" \
            --arg d "${{ steps.msg.outputs.details }}" \
            --arg v "${{ steps.msg.outputs.version }}" \
            '{title: $t, body: $b, details: $d, version: $v, kind: "update", active: true}' > payload.json
          # L'URL du nouvel APK est ajoutée à la main après le build (action_url)
          curl -sS -X POST "$SUPABASE_URL/rest/v1/broadcasts" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            --data @payload.json
          echo "Broadcast inséré."
