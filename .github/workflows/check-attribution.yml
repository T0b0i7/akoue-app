name: Check project attribution

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify attribution notice
        run: node scripts/check-attribution.js
