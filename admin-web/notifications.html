<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akouè Admin — Notifications</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav><span class="brand">Akouè Admin</span><a href="index.html">Dashboard</a><a href="users.html">Utilisateurs</a><a href="notifications.html">Notifications</a><button id="logout">Déconnexion</button></nav>
<main>
  <h1>Notifications → tous les utilisateurs</h1>
  <p class="muted">Publié ici = affiché dans l'app mobile (table <code>broadcasts</code> avec <code>active = true</code>).<br>
  <b>info</b> : annonce simple &nbsp;•&nbsp; <b>update</b> : mise à jour avec bouton + version ciblée.</p>

  <div class="panel">
    <h3>Nouvelle notification</h3>
    <input id="f_title" placeholder="Titre (ex : Akouè 1.2 disponible)">
    <textarea id="f_body" rows="3" placeholder="Message…"></textarea>
    <div class="row">
      <select id="f_kind"><option value="info">info</option><option value="update">update (mise à jour)</option></select>
      <input id="f_version" placeholder="Version ciblée (ex : 1.2.0)">
      <input id="f_url" placeholder="Lien APK Expo (facultatif pour une annonce à venir)">
    </div>
    <textarea id="f_details" rows="2" placeholder="Détails vulgarisés (optionnel)"></textarea>
    <label class="row" style="align-items:center;gap:10px">
      <input id="f_send_email" type="checkbox" style="width:auto">
      <span>Envoyer aussi un e-mail de service aux comptes inscrits (une seule fois)</span>
    </label>
    <button class="primary" onclick="publish()">Publier pour tous</button>
  </div>

  <h3>Historique</h3>
  <div id="list"></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
async function load() {
  if (!await guard()) return;
  const { data } = await sb.from("broadcasts").select("*").order("created_at", { ascending: false }).limit(100);
  document.getElementById("list").innerHTML = (data || []).map(r => `
    <div class="panel" style="opacity:${r.active ? 1 : .55}">
      <span class="badge ${r.kind === "update" ? "update" : ""} ${r.active ? "" : "off"}">${r.kind}${r.active ? "" : " — désactivé"}</span>
      <b> ${r.title}</b> ${r.version ? `<span class="muted">→ v${r.version}</span>` : ""}
      <p>${r.body}</p>
      <button class="ghost" onclick="toggle('${r.id}', ${!r.active})">${r.active ? "Désactiver" : "Réactiver"}</button>
      <button class="ghost" onclick="removeOne('${r.id}')">Supprimer</button>
    </div>`).join("");
}
async function publish() {
  const title = document.getElementById("f_title").value.trim();
  const body = document.getElementById("f_body").value.trim();
  const sendEmail = document.getElementById("f_send_email").checked;
  const kind = document.getElementById("f_kind").value;
  const version = document.getElementById("f_version").value.trim();
  const actionUrl = document.getElementById("f_url").value.trim();
  if (!title || !body) { alert("Titre + message requis"); return; }
  if (sendEmail && kind !== "update") {
    alert("L'e-mail de service nécessite le type « update ».");
    return;
  }
  if (sendEmail && !confirm("Envoyer cet e-mail de service à tous les comptes Akouè inscrits avec une adresse e-mail ? L'envoi ne pourra pas être annulé.")) return;
  const details = document.getElementById("f_details").value.trim();
  const announcement = {
    title, body,
    kind,
    active: true,
  };
  if (version) announcement.version = version;
  if (actionUrl) announcement.action_url = actionUrl;
  if (details) announcement.details = details;
  const { data: broadcast, error } = await sb.from("broadcasts").insert(announcement).select("id").single();
  if (error) { alert("Erreur : " + error.message); return; }
  if (sendEmail) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.access_token) {
      alert("Annonce publiée, mais aucun jeton admin n'est disponible pour l'e-mail.");
      return;
    }
    try {
      const response = await fetch("https://akoue-app.vercel.app/api/admin/send-update-email", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({
          broadcastId: broadcast.id,
          title,
          body,
          details,
          version,
          actionUrl,
        }),
      });
      const result = await response.json();
      if (!response.ok) {
        alert(`Annonce publiée. E-mail non envoyé : ${result.error || "erreur serveur"}${result.sentCount ? ` (${result.sentCount}/${result.recipientCount} destinataires déjà traités)` : ""}`);
        load();
        return;
      }
      alert(`Annonce publiée et e-mail envoyé à ${result.sentCount} compte(s).`);
    } catch (e) {
      alert(`Annonce publiée, mais l'envoi d'e-mail a échoué : ${e.message}`);
      load();
      return;
    }
  }
  ["f_title","f_body","f_version","f_details","f_url"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f_send_email").checked = false;
  load();
}
async function toggle(id, active) {
  await sb.from("broadcasts").update({ active }).eq("id", id);
  load();
}
async function removeOne(id) {
  if (!confirm("Supprimer ?")) return;
  await sb.from("broadcasts").delete().eq("id", id);
  load();
}
load();
</script>
</body>
</html>
