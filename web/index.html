<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Akouè" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/images/mono-akoue.png" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <title>Akouè — Maîtrise ton argent</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Enregistrement du Service Worker PWA (installation + hors ligne)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Akouè SW enregistré :', reg.scope))
          .catch((err) => console.log('Akouè SW erreur :', err));
      });
    }

    // Détection de l'installation PWA (Android)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      deferredPrompt = e;
    });
    window.__akoueInstall = () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') console.log('Akouè installé');
          deferredPrompt = null;
        });
      }
    };
  </script>
</body>
</html>
