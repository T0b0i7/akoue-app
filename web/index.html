<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#171717" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Akouè" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/images/mono-akoue.png" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />
  <title>Akouè — Maîtrise ton argent</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Le service worker ne doit pas servir un ancien bundle Metro en développement.
    if ('serviceWorker' in navigator) {
      const localDev = ['localhost', '127.0.0.1'].includes(location.hostname);
      if (localDev) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
        if ('caches' in window) {
          caches.keys().then((keys) => {
            keys.filter((key) => key.startsWith('akoue-')).forEach((key) => caches.delete(key));
          });
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch((err) => console.warn('Akouè SW erreur :', err));
        });
      }
    }

    // Détection de l'installation PWA (Android)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.__akoueInstallPrompt = e;
      window.dispatchEvent(new Event('akoue-install-available'));
    });
    window.addEventListener('appinstalled', () => {
      window.__akoueInstallPrompt = null;
    });
  </script>
</body>
</html>
